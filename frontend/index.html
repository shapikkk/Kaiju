<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaiju</title>
    <script>
      (function () {
        var ACCENTS = ["zinc","blue","rose","emerald","orange","violet"];
        var BASES   = ["zinc","slate","neutral"];
        var el = document.documentElement;
        var accent = localStorage.getItem("accent-theme");
        var base   = localStorage.getItem("base-theme");
        el.setAttribute("data-theme", ACCENTS.includes(accent) ? accent : "zinc");
        el.setAttribute("data-base",  BASES.includes(base)   ? base   : "zinc");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
